<title>Riv lappar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@96,75,800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Big+Shoulders+Display:wght@900&display=swap">
<style>
/* Layout: en rad per riktning; varje rad visar samma lapp på tre papper i verklig storlek (330 px bred, som i appen). */
:root {
  --bg: #e9e8ee; --surface: #f7f6fa; --ink: #1b1a21; --muted: #64626f; --line: rgba(27,26,33,.12);
  --board: #a9a39a; --board-2: #958f86;
  --f-num: 'Bricolage Grotesque', 'Arial Narrow', sans-serif;
  --f-body: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --f-display: 'Big Shoulders Display', Impact, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #16151b; --surface: #222129; --ink: #f1eff6; --muted: #a09dab; --line: rgba(241,239,246,.12); --board: #3b3935; --board-2: #2e2c29; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #16151b; --surface: #222129; --ink: #f1eff6; --muted: #a09dab; --line: rgba(241,239,246,.12); --board: #3b3935; --board-2: #2e2c29; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
h1 { font: 900 clamp(44px, 8vw, 80px)/.9 var(--f-display); text-transform: uppercase; margin: 0 0 10px; }
.lead { color: var(--muted); max-width: 62ch; margin: 0 0 8px; }
.label { font: 500 11px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.dir { margin-top: 44px; padding-top: 24px; border-top: 1px solid var(--line); display: grid; gap: 16px; }
.dir header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.dir h2 { margin: 0; font: 900 36px/1 var(--f-display); text-transform: uppercase; }
.dir p { margin: 0; color: var(--muted); max-width: 64ch; }
.row { display: flex; gap: 22px; overflow-x: auto; padding: 14px 6px 20px; scroll-snap-type: x mandatory; }
.row > * { scroll-snap-align: start; }

/* Papper (samma som i appen) */
[data-paper="smor"] { --p-bg: #f6df8b; --p-bg2: #eccf6c; --p-ink: #3b2c05; --p-muted: #7b6320; --p-line: rgba(59,44,5,.22); --p-hole: #c2a245; --p-stamp: #b3430f; }
[data-paper="rosa"] { --p-bg: #f7bccb; --p-bg2: #f0a8ba; --p-ink: #4a1426; --p-muted: #8c4a5d; --p-line: rgba(74,20,38,.2); --p-hole: #c97f93; --p-stamp: #c01f48; }
[data-paper="kol"]  { --p-bg: #29282e; --p-bg2: #1f1e23; --p-ink: #f3eee4; --p-muted: #a29d92; --p-line: rgba(243,238,228,.16); --p-hole: #55525c; --p-stamp: #e8c27c; }

/* Blocket: kartong, bindning, stubbe och perforering (oförändrat från appen) */
.pad { position: relative; flex: none; width: 330px; height: 470px; }
.pad .board { position: absolute; inset: -8px -8px -11px; border-radius: 20px; background: linear-gradient(165deg, var(--board), var(--board-2)); box-shadow: 0 26px 44px -20px rgba(20,16,10,.35); }
.pad .binding { position: absolute; top: -8px; left: -8px; right: -8px; height: 32px; border-radius: 20px 20px 0 0; background: #1b1a21; color: #e9e6df; display: grid; place-items: center; font: 500 10.5px var(--f-mono); letter-spacing: .2em; z-index: 3; }
.pad .sheet { position: absolute; left: 2px; right: 2px; top: 26px; bottom: -4px; border-radius: 4px 4px 14px 14px; background: var(--p-bg2); }
.t { position: absolute; left: 0; right: 0; top: 24px; bottom: 0; color: var(--p-ink); }
.stub { height: 46px; background: var(--p-bg2); border-radius: 3px 3px 0 0; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 18px 9px; font: 500 10px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--p-muted); }
.perf { position: relative; height: 20px; margin: -10px 0; z-index: 2; }
.perf::before { content: ""; position: absolute; left: 12px; right: 12px; top: 9px; height: 2px; background: repeating-linear-gradient(90deg, var(--p-hole) 0 4px, transparent 4px 9px); }
.perf i { position: absolute; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--board-2); }
.perf i:first-child { left: -8px; } .perf i:last-child { right: -8px; }
.body { position: relative; height: calc(100% - 46px); background: linear-gradient(176deg, var(--p-bg), var(--p-bg2) 160%); border-radius: 0 0 14px 14px; overflow: hidden; }
.mono { font-family: var(--f-mono); }
.num { font-family: var(--f-num); font-weight: 800; font-stretch: 75%; font-variant-numeric: tabular-nums; }
.note { border-bottom: 1px dashed var(--p-line); padding: 5px 0; font-size: 14px; color: var(--p-muted); }
.stamp { border: 1.5px solid var(--p-stamp); color: var(--p-stamp); font: 500 10px var(--f-mono); letter-spacing: .16em; text-transform: uppercase; padding: 4px 9px; border-radius: 5px; transform: rotate(-5deg); opacity: .55; display: inline-block; }
.bar { width: 76px; height: 18px; opacity: .55; background: repeating-linear-gradient(90deg, var(--p-ink) 0 1.5px, transparent 1.5px 3.5px, var(--p-ink) 3.5px 4.5px, transparent 4.5px 7px, var(--p-ink) 7px 9.5px, transparent 9.5px 11px); }

/* A: Biobiljetten */
.A { padding: 14px; }
.A .frame { height: 100%; border: 1.5px solid var(--p-ink); border-radius: 10px; outline: 1px solid var(--p-line); outline-offset: -6px; padding: 14px 14px 12px; display: grid; grid-template-rows: auto 1fr auto auto; gap: 10px; }
.A .top { display: flex; justify-content: space-between; font: 600 10px var(--f-mono); letter-spacing: .16em; text-transform: uppercase; }
.A .mid { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.A .big { font-size: 132px; line-height: .8; letter-spacing: -.02em; }
.A dl { margin: 0; display: grid; gap: 8px; }
.A dt { font: 500 9px var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--p-muted); }
.A dd { margin: 0; font: 700 15px var(--f-body); line-height: 1.15; }
.A .foot { display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px dashed var(--p-line); padding-top: 10px; }

/* B: Lottlotten */
.B { padding: 16px; display: grid; }
.B .frame { border: 3px double var(--p-ink); border-radius: 14px; display: grid; grid-template-rows: auto 1fr auto auto; justify-items: center; text-align: center; padding: 14px 16px; gap: 6px; }
.B .no { font: 600 11px var(--f-mono); letter-spacing: .3em; text-transform: uppercase; }
.B .big { font-size: 168px; line-height: .78; align-self: center; position: relative; }
.B .big sup { position: absolute; top: 8px; left: -26px; font: 700 20px var(--f-body); }
.B .title { font: 700 19px var(--f-body); }
.B .pips { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 220px; }
.B .pips i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--p-ink); }
.B .pips i.on { background: var(--p-ink); }
.B .keep { font: 500 9px var(--f-mono); letter-spacing: .2em; text-transform: uppercase; color: var(--p-muted); }

/* C: Kvittot */
.C { padding: 18px 22px; font-family: var(--f-mono); font-size: 12.5px; display: grid; align-content: start; gap: 6px; }
.C .logo { text-align: center; font-size: 34px; line-height: 1; letter-spacing: .02em; margin-bottom: 2px; }
.C .center { text-align: center; color: var(--p-muted); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; }
.C hr { border: 0; border-top: 1.5px dashed var(--p-ink); opacity: .5; margin: 6px 0; width: 100%; }
.C .li { display: flex; gap: 6px; align-items: baseline; }
.C .li span:nth-child(2) { flex: 1; border-bottom: 1.5px dotted var(--p-line); transform: translateY(-3px); }
.C .li b { font-weight: 600; }
.C .tot { font-size: 15px; font-weight: 600; }
.C .tot .num { font-size: 44px; line-height: .9; }
.C .thanks { text-align: center; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; margin-top: 4px; }
.C .bar { margin: 6px auto 0; width: 140px; height: 26px; }

/* D: Affischen */
.D { padding: 20px; }
.D .meta { display: flex; justify-content: space-between; font: 500 10px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--p-muted); }
.D .title { font-family: var(--f-num); font-weight: 800; font-stretch: 75%; font-size: 46px; line-height: .9; text-transform: uppercase; margin-top: 14px; max-width: 8ch; overflow-wrap: anywhere; }
.D .ico { font-size: 26px; margin-top: 10px; }
.D .big { position: absolute; right: -14px; bottom: -36px; font-size: 300px; line-height: .8; letter-spacing: -.03em; opacity: .95; }
.D .of { position: absolute; left: 20px; bottom: 66px; font: 600 13px var(--f-mono); letter-spacing: .1em; }
.D .ticks { position: absolute; left: 20px; bottom: 50px; display: flex; gap: 2px; }
.D .ticks i { width: 4px; height: 10px; background: var(--p-ink); opacity: .22; border-radius: 1px; }
.D .ticks i.on { opacity: 1; }
.D .notebox { position: absolute; left: 20px; right: 150px; bottom: 14px; }
</style>

<div class="wrap">
  <span class="label">Riv · insidan av lappen</span>
  <h1>Fyra lappar</h1>
  <p class="lead">Samma lapp (Kalla bad, lapp 7 av 30, 26 november) i fyra riktningar och tre papper. Stubben, perforeringen och kartongen är desamma som i appen, så rivandet fungerar likadant. Scrolla i sidled på mobilen.</p>
  <div id="out"></div>
</div>

<script>
const D = { title: 'Kalla bad', icon: '🧊', n: 7, total: 30, date: '26 NOV', pace: 'En om dagen', id: 'K7QD' };
const p2 = (x) => String(x).padStart(2, '0');
const pips = (on, all, max = 30) => Array.from({ length: Math.min(all, max) }, (_, i) => `<i class="${i < on ? 'on' : ''}"></i>`).join('');
const DIRS = [
  { k: 'A', name: 'Biobiljetten', idea: 'Inramad som en biobiljett. Stort nummer till vänster och fakta som rutor till höger, så att allt går att läsa på ett ögonblick. Mest information, men ändå ordnat.',
    body: () => `<div class="frame">
      <div class="top"><span>RIV</span><span>Gäller en gång</span></div>
      <div class="mid"><div class="num big">${p2(D.n)}</div>
        <dl><div><dt>Block</dt><dd>${D.icon} ${D.title}</dd></div><div><dt>Lapp</dt><dd>${D.n} av ${D.total}</dd></div><div><dt>Datum</dt><dd>${D.date}</dd></div><div><dt>Tempo</dt><dd>${D.pace}</dd></div></dl></div>
      <div class="note">Hur gick det?</div>
      <div class="foot"><div><div class="bar"></div><div class="mono" style="font-size:9.5px;letter-spacing:.12em;margin-top:3px;opacity:.7">RB-${D.id}-${p2(D.n)}</div></div><span class="stamp">Riv av</span></div></div>` },
  { k: 'B', name: 'Lottlotten', idea: 'Den klassiska nummerlappen. Jättenumret i mitten, dubbel ram och en rad prickar som visar hur långt du har kommit. Lekfull och direkt.',
    body: () => `<div class="frame">
      <div class="no">Nummer</div>
      <div class="num big"><sup>Nº</sup>${p2(D.n)}</div>
      <div><div class="title">${D.icon} ${D.title}</div><div class="mono" style="font-size:11px;letter-spacing:.12em;opacity:.7;margin-top:2px">${D.date} · ${D.n} AV ${D.total}</div></div>
      <div style="display:grid;gap:8px;justify-items:center"><div class="pips">${pips(D.n, D.total)}</div><div class="keep">Behåll denna del · Riv</div></div></div>` },
  { k: 'C', name: 'Kvittot', idea: 'Som ett kvitto från kassan, med prickade rader mellan rubrik och värde. Lugnt och lite humoristiskt ("Tack för idag"). Fungerar på alla papper men passar Kvitto-pappret extra bra.',
    body: () => `<div class="logo num">RIV</div><div class="center">${D.icon} ${D.title}</div><hr>
      <div class="li"><span>LAPP</span><span></span><b>${p2(D.n)} / ${D.total}</b></div>
      <div class="li"><span>DATUM</span><span></span><b>${D.date} 2026</b></div>
      <div class="li"><span>TEMPO</span><span></span><b>${D.pace.toUpperCase()}</b></div>
      <div class="li"><span>KVAR EFTER</span><span></span><b>${D.total - D.n}</b></div><hr>
      <div class="li tot"><span>SUMMA</span><span></span><span class="num">${p2(D.n)}</span></div><hr>
      <div style="font-size:10.5px;opacity:.7">ANTECKNING:</div><div class="note" style="font-family:var(--f-body)">Hur gick det?</div>
      <div class="thanks">Tack för idag</div><div class="bar"></div>` },
  { k: 'D', name: 'Affischen', idea: 'Minimalistisk och grafisk. Titeln står stort i logotypens font och numret är så stort att det går ut över kanten. En stapel streck visar framstegen. Mest "design", minst information.',
    body: () => `<div class="meta"><span>Lapp ${p2(D.n)}</span><span>${D.date}</span></div>
      <div class="title">${D.title}</div><div class="ico">${D.icon}</div>
      <div class="num big">${p2(D.n)}</div>
      <div class="of">${D.n} / ${D.total}</div>
      <div class="ticks">${pips(D.n, D.total)}</div>
      <div class="notebox"><div class="note">Hur gick det?</div></div>` }
];
const pad = (dir, paper) => `<div class="pad" data-paper="${paper}"><div class="board"></div><div class="binding">${D.total - D.n + 1} KVAR</div><div class="sheet"></div>
  <div class="t"><div class="stub"><span>${D.title}</span><span>RB-${D.id}</span></div><div class="perf"><i></i><i></i></div>
  <div class="body ${dir.k}">${dir.body()}</div></div></div>`;
document.getElementById('out').innerHTML = DIRS.map((d, i) => `<section class="dir"><header><span class="label">Riktning ${'ABCD'[i]}</span><h2>${d.name}</h2></header><p>${d.idea}</p>
  <div class="row">${['smor', 'rosa', 'kol'].map((p) => pad(d, p)).join('')}</div></section>`).join('');
</script>
