<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Riv Logo'; src: url('../src/fonts/BricolageSmal-RIV.woff2') format('woff2'); font-weight: 800; }
html, body { margin: 0; } svg { display: block; }
</style></head><body><div id="out"></div><script>
// Ritar Riv-ikonen/startskärmen i full upplösning. Variant via #gul, #mork, #tonad, #splash, #splash-mork
const V = {
  gul:   { bg: '#f6df8b', bind: '#1b1a21', ink: '#3b2c05', perf: '#a98b2e', notch: '#d9bf62' },
  mork:  { bg: '#232227', bind: '#0d0d10', ink: '#f1efe9', perf: '#6c6a72', notch: '#141317' },
  tonad: { bg: '#000000', bind: '#3a3a3a', ink: '#ffffff', perf: '#8a8a8a', notch: '#1e1e1e' }
};
const k = location.hash.slice(1) || 'gul';
const word = (ink, size, y) => `<text x="50" y="${y}" text-anchor="middle" font-family="'Riv Logo'" font-weight="800" font-size="${size}" fill="${ink}">RIV</text>`;
let svg;
if (k.startsWith('splash')) {
  const c = k === 'splash' ? V.gul : V.mork;
  svg = `<svg viewBox="0 0 100 100" width="2732" height="2732"><rect width="100" height="100" fill="${c.bg}"/>${word(c.ink, 16, 54)}<line x1="40" y1="59" x2="60" y2="59" stroke="${c.perf}" stroke-width=".7" stroke-dasharray="1.1 1.1"/></svg>`;
} else {
  const c = V[k];
  svg = `<svg viewBox="0 0 100 100" width="1024" height="1024"><rect width="100" height="100" fill="${c.bg}"/><rect width="100" height="20" fill="${c.bind}"/>
    <circle cx="0" cy="32" r="5" fill="${c.notch}"/><circle cx="100" cy="32" r="5" fill="${c.notch}"/>
    <line x1="9" y1="32" x2="91" y2="32" stroke="${c.perf}" stroke-width="2" stroke-dasharray="3.5 3.5"/>${word(c.ink, 50, 82)}</svg>`;
}
document.fonts.load("800 50px 'Riv Logo'").then(() => { document.getElementById('out').innerHTML = svg; document.title = 'klar'; });
</script></body></html>
