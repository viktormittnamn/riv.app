<title>Riv logokoncept</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: en jämförelserad överst (alla ikoner på en hemskärm), sedan ett avsnitt per koncept med ikon i flera storlekar och ordmärke på ljust/mörkt. */
:root {
  --bg: #e9e8ee; --surface: #f7f6fa; --ink: #1b1a21; --muted: #64626f; --line: rgba(27,26,33,.12);
  --wall-a: #c9c3d8; --wall-b: #e9c9bd;
  --f-display: 'Big Shoulders Display', Impact, 'Arial Narrow', sans-serif;
  --f-body: 'Instrument Sans', -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #16151b; --surface: #222129; --ink: #f1eff6; --muted: #a09dab; --line: rgba(241,239,246,.12); --wall-a: #2b2738; --wall-b: #3b2a2a; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #16151b; --surface: #222129; --ink: #f1eff6; --muted: #a09dab; --line: rgba(241,239,246,.12); --wall-a: #2b2738; --wall-b: #3b2a2a; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
h1 { font: 900 clamp(48px, 9vw, 88px)/.9 var(--f-display); text-transform: uppercase; margin: 0 0 10px; }
.lead { color: var(--muted); max-width: 56ch; margin: 0 0 28px; }
.label { font: 500 11px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* hemskärm */
.home { border-radius: 28px; padding: 28px 22px 22px; background: linear-gradient(150deg, var(--wall-a), var(--wall-b)); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px 12px; justify-items: center; }
.app { display: grid; justify-items: center; gap: 6px; width: 100%; }
.app svg { width: min(76px, 100%); height: auto; filter: drop-shadow(0 4px 8px rgba(0,0,0,.18)); }
.app span { font: 500 12px var(--f-body); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
.dummy { width: min(76px, 100%); aspect-ratio: 1; border-radius: 22%; background: rgba(255,255,255,.35); }

.concept { margin-top: 56px; padding-top: 28px; border-top: 1px solid var(--line); display: grid; gap: 20px; }
.concept header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.concept h2 { font: 900 40px/1 var(--f-display); text-transform: uppercase; margin: 0; }
.concept p { margin: 0; color: var(--muted); max-width: 60ch; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; }
.big svg { width: 168px; height: 168px; display: block; filter: drop-shadow(0 12px 24px rgba(0,0,0,.18)); }
.sizes { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
.sizes figure { margin: 0; display: grid; justify-items: center; gap: 6px; }
.sizes figcaption { font: 400 11px var(--f-mono); color: var(--muted); }
.marks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mark { border-radius: 18px; padding: 28px 20px; display: grid; place-items: center; min-height: 140px; }
.mark.light { background: #f7f6fa; color: #1b1a21; box-shadow: inset 0 0 0 1px rgba(27,26,33,.08); }
.mark.dark { background: #1b1a21; color: #f3eee4; }
.mark svg { width: min(260px, 100%); height: auto; }
.pros { display: flex; flex-wrap: wrap; gap: 8px; }
.pros span { font: 500 12.5px var(--f-body); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); }
@media (max-width: 640px) { .row { grid-template-columns: 1fr; } .big svg { width: 140px; height: 140px; } .marks { grid-template-columns: 1fr; } }
</style>

<div class="wrap">
  <span class="label">Rivblock → Riv</span>
  <h1>Riv logokoncept</h1>
  <p class="lead">Fyra riktningar för appikon och ordmärke. Överst står de bredvid varandra på en hemskärm. Längre ner ser du varje koncept i flera storlekar, ända ner till 29 px som i Inställningar och notiser.</p>

  <div class="home" id="home"></div>
  <div id="concepts"></div>
</div>

<script>
const F = "'Big Shoulders Display', Impact, sans-serif";
// sågtand längs en horisontell linje (x från a till b)
const zig = (y, a, b, step = 5, amp = 2) => { const p = []; for (let x = a, i = 0; (a < b ? x <= b : x >= b); x += (a < b ? step : -step), i++) p.push(`${x},${y + (i % 2 ? amp : -amp)}`); return p.join(' '); };

const C = [
  {
    id: 'r', name: 'Avrivet R', idea: 'Ett stort R som är rivet itu längs en perforering. Nedre halvan har lossnat lite. Rent och tydligt även i liten storlek.',
    pros: ['Syns tydligt i 29 px', 'Fungerar utan text', 'Lätt att animera'],
    icon: () => `
      <defs>
        <clipPath id="rt"><polygon points="0,0 100,0 100,57 ${zig(57, 100, 0)} 0,57"/></clipPath>
        <clipPath id="rb"><polygon points="${zig(57, 0, 100)} 100,100 0,100"/></clipPath>
      </defs>
      <rect width="100" height="100" fill="#ef4a2f"/>
      <g fill="#fff" font-family="${F}" font-weight="900" font-size="88" text-anchor="middle">
        <text x="50" y="84" clip-path="url(#rt)">R</text>
        <g transform="translate(3 5) rotate(6 50 57)"><text x="50" y="84" clip-path="url(#rb)">R</text></g>
      </g>
      <line x1="8" y1="57" x2="92" y2="57" stroke="#fff" stroke-opacity=".55" stroke-width="2" stroke-dasharray="3 3"/>`,
    mark: (fg) => `<svg viewBox="0 0 220 90"><defs>
        <clipPath id="wt${fg.slice(1)}"><polygon points="0,0 220,0 220,50 ${zig(50, 220, 0, 6, 2)} 0,50"/></clipPath>
        <clipPath id="wb${fg.slice(1)}"><polygon points="${zig(50, 0, 220, 6, 2)} 220,90 0,90"/></clipPath></defs>
      <g fill="${fg}" font-family="${F}" font-weight="900" font-size="96">
        <text x="6" y="82" clip-path="url(#wt${fg.slice(1)})">Riv</text>
        <g transform="translate(2 4) rotate(3 40 50)"><text x="6" y="82" clip-path="url(#wb${fg.slice(1)})">Riv</text></g>
      </g></svg>`
  },
  {
    id: 't', name: 'Biljetten', idea: 'En rosa nummerlapp med halvrunda hack i kanterna. Den högra stubben håller på att rivas av. Knyter an till appens papper och färger.',
    pros: ['Berättar vad appen gör', 'Unik silhuett', 'Lekfull'],
    icon: () => `
      <rect width="100" height="100" fill="#1b1a21"/>
      <path d="M12 26 h52 v48 h-52 z" fill="#f7bccb"/>
      <circle cx="12" cy="50" r="6" fill="#1b1a21"/>
      <text x="38" y="62" text-anchor="middle" font-family="${F}" font-weight="900" font-size="30" fill="#4a1426">RIV</text>
      <g transform="translate(4 3) rotate(9 66 26)">
        <polygon points="${zig(26, 66, 66, 1, 0)} 66,26 88,26 88,74 66,74 ${Array.from({ length: 10 }, (_, i) => `${66 + (i % 2 ? 1.6 : -1.2)},${74 - i * 4.8}`).join(' ')}" fill="#f0a8ba"/>
        <circle cx="88" cy="50" r="6" fill="#1b1a21"/>
        <text x="77" y="55" text-anchor="middle" font-family="${F}" font-weight="800" font-size="11" fill="#8c4a5d">07</text>
      </g>
      <line x1="66" y1="28" x2="66" y2="72" stroke="#c97f93" stroke-width="1.6" stroke-dasharray="2.5 2.5"/>`,
    mark: (fg) => `<svg viewBox="0 0 260 90">
      <g transform="translate(0 15) scale(.6)"><path d="M0 0 h70 v100 h-70 z" fill="#f7bccb"/><circle cx="0" cy="50" r="9" fill="${fg === '#1b1a21' ? '#f7f6fa' : '#1b1a21'}"/><circle cx="70" cy="50" r="9" fill="${fg === '#1b1a21' ? '#f7f6fa' : '#1b1a21'}"/><line x1="0" y1="72" x2="70" y2="72" stroke="#c97f93" stroke-width="3" stroke-dasharray="5 5"/><text x="35" y="56" text-anchor="middle" font-family="${F}" font-weight="900" font-size="44" fill="#4a1426">R</text></g>
      <text x="62" y="76" font-family="${F}" font-weight="900" font-size="84" fill="${fg}">Riv</text></svg>`
  },
  {
    id: 'p', name: 'Lappen', idea: 'Appens eget block: svart bindning, prickad linje och ett gemener-"riv" på gult papper. Närmast det som finns i appen i dag.',
    pros: ['Samma språk som appen', 'Varm och vänlig', 'Gemener känns moderna'],
    icon: () => `
      <rect width="100" height="100" fill="#f6df8b"/>
      <rect width="100" height="20" fill="#1b1a21"/>
      <circle cx="0" cy="32" r="5" fill="#d9bf62"/><circle cx="100" cy="32" r="5" fill="#d9bf62"/>
      <line x1="8" y1="32" x2="92" y2="32" stroke="#a98b2e" stroke-width="2" stroke-dasharray="3.5 3.5"/>
      <text x="50" y="86" text-anchor="middle" font-family="${F}" font-weight="900" font-size="62" fill="#3b2c05">riv</text>`,
    mark: (fg) => `<svg viewBox="0 0 200 100">
      <text x="100" y="74" text-anchor="middle" font-family="${F}" font-weight="900" font-size="96" fill="${fg}">riv</text>
      <line x1="30" y1="88" x2="170" y2="88" stroke="${fg}" stroke-opacity=".5" stroke-width="4" stroke-dasharray="7 7"/></svg>`
  },
  {
    id: 'm', name: 'Perforeringen', idea: 'Ingen bokstav alls: en ruta som rivs längs en rad hål och där nedre delen viker iväg. Abstrakt, som Notion eller Things.',
    pros: ['Mest premium', 'Tidlös', 'Kräver att namnet bär'],
    icon: () => `
      <rect width="100" height="100" fill="#1b1a21"/>
      <rect x="22" y="22" width="56" height="28" rx="3" fill="#ef4a2f"/>
      <g transform="translate(2 4) rotate(8 22 54)"><rect x="22" y="54" width="56" height="26" rx="3" fill="#ef4a2f"/></g>
      <g fill="#f3eee4">${[0, 1, 2, 3, 4, 5].map((i) => `<circle cx="${25 + i * 10}" cy="52" r="2.2"/>`).join('')}</g>`,
    mark: (fg) => `<svg viewBox="0 0 230 90">
      <g transform="translate(4 12)"><rect width="56" height="30" rx="4" fill="#ef4a2f"/><g transform="translate(2 5) rotate(8 0 34)"><rect y="34" width="56" height="30" rx="4" fill="#ef4a2f"/></g>
      <g fill="${fg}">${[0, 1, 2, 3, 4].map((i) => `<circle cx="${6 + i * 11}" cy="32" r="2.4"/>`).join('')}</g></g>
      <text x="82" y="74" font-family="${F}" font-weight="900" font-size="84" fill="${fg}">riv</text></svg>`
  }
];

// varje ikon får unika id:n för sina clipPaths
const icon = (c, uid) => `<svg viewBox="0 0 100 100" role="img" aria-label="${c.name}"><defs><clipPath id="sq${uid}"><rect width="100" height="100" rx="22.4"/></clipPath></defs><g clip-path="url(#sq${uid})">${c.icon().replaceAll('id="r', `id="${uid}r`).replaceAll('url(#r', `url(#${uid}r`)}</g></svg>`;

let n = 0;
document.getElementById('home').innerHTML =
  C.map((c) => `<div class="app">${icon(c, 'h' + n++)}<span>${c.name}</span></div>`).join('') +
  ['Kamera', 'Kartor', 'Väder', 'Musik'].map((l) => `<div class="app"><div class="dummy"></div><span>${l}</span></div>`).join('');

document.getElementById('concepts').innerHTML = C.map((c, i) => `
  <section class="concept" id="${c.id}">
    <header><span class="label">Koncept ${i + 1}</span><h2>${c.name}</h2></header>
    <p>${c.idea}</p>
    <div class="row">
      <div class="big">${icon(c, 'b' + n++)}</div>
      <div class="sizes">${[76, 60, 40, 29].map((s) => `<figure><div style="width:${s}px;height:${s}px">${icon(c, 's' + n++)}</div><figcaption>${s} px</figcaption></figure>`).join('')}</div>
    </div>
    <div class="marks"><div class="mark light">${c.mark('#1b1a21')}</div><div class="mark dark">${c.mark('#f3eee4')}</div></div>
    <div class="pros">${c.pros.map((p) => `<span>${p}</span>`).join('')}</div>
  </section>`).join('');
</script>
